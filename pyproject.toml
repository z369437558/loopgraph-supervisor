[project]
name = "loopgraph"
version = "0.2.0"
description = "DSH-first, harness-neutral, durably recoverable LoopGraph supervisor"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
